
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Student Profile</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            color: #263238;
        }

        header {
            background: #243b55;
            color: white;
            text-align: center;
            padding: 35px 20px;
        }

        nav {
            background: #141e30;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
        }

        main {
            max-width: 850px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px #00000012;
        }

        .card img {
            width: 160px;
            height: 160px;
            object-fit: cover;
            border-radius: 50%;
        }

        .button {
            display: inline-block;
            background: #243b55;
            color: white;
            padding: 12px 22px;
            border-radius: 6px;
            text-decoration: none;
            margin-top: 15px;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #666;
        }
    </style>
</head>

<body>

    <header>
        <h1>WELCOME TO MY WEBSITE</h1>
        <p>My Student Profile</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
    </nav>

    <main>
        <section class="card">

            <img src="./my_picture.png..jpg" alt="My Profile Picture">

            <h2>Hello! Welcome to My Profile</h2>

            <p>Thank you for visiting my personal website.</p>

            <a class="button" href="profile.html">View My Profile</a>

        </section>
    </main>

    <footer>
        <p>© 2026 My Student Profile</p>
    </footer>

</body>
</html>
